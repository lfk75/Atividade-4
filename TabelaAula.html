<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>

    <style>
        table, td, th{
            border: 1px solid black;
            border-collapse: collapse;
            text-align: center;
            padding: 2%;
            
            
        }
        .clase{
            background-color: cyan;
        }
    </style>
</head>
<body>
    <table>
        <caption>Trajetoria academica</caption>
            <tr class="clase">
                <th rowspan="2" width="25%">Estudante</th>
                <th colspan="2">Formação</th> 
                <th rowspan="2">Ano de conclusão</th>
            </tr>
            <tr class="clase">  
                <th>Graduação</th>
                <th>Pos-graduação</th>
                
            </tr>
            <tr>
                <th>José</th>
                <td>Ciencia da computação</td>
                <td>Inteligencia Artificial</td>
                <td>2023</td>
            </tr>
            <tr>
                <th>Ana</th>
                <td>Engenharia de Software</td>
                <td>Gestão de Projeto</td>
                <td>2022</td>
            </tr>

    </table>
    
</body>
</html>
